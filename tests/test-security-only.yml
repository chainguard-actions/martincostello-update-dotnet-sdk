name: Test security-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch latest .NET 8 SDK version and write global.json
        run: |
          # Fetch the latest SDK version so it is guaranteed to be in releases.json
          if command -v jq &>/dev/null; then
            LATEST=$(curl -sfL "https://raw.githubusercontent.com/dotnet/core/main/release-notes/8.0/releases.json" | jq -r '."latest-sdk"')
          elif command -v python3 &>/dev/null; then
            LATEST=$(curl -sfL "https://raw.githubusercontent.com/dotnet/core/main/release-notes/8.0/releases.json" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['latest-sdk'])")
          fi
          # Fall back to a known-good version if fetch failed
          if [ -z "$LATEST" ]; then
            LATEST="8.0.419"
          fi
          echo "Using SDK version: $LATEST"
          cat > ./global.json << EOF
          {
            "sdk": {
              "version": "$LATEST",
              "rollForward": "latestFeature"
            }
          }
          EOF
          cat ./global.json

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          dry-run: 'true'
          channel: '8.0'
          security-only: 'true'
          generate-step-summary: 'false'

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: expected sdk-version to be non-empty"
            exit 1
          fi
          echo "PASS: sdk-version=$SDK_VERSION"

      - name: Assert sdk-updated output is set (may be true or false depending on security releases)
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
          SECURITY: ${{ steps.action.outputs.security }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          echo "security: $SECURITY"
          if [ -z "$SDK_UPDATED" ]; then
            echo "FAIL: expected sdk-updated output to be set"
            exit 1
          fi
          # If sdk-updated is true, security must also be true (security-only mode)
          if [ "$SDK_UPDATED" = "true" ] && [ "$SECURITY" != "true" ]; then
            echo "FAIL: security-only mode updated SDK but security output is not true"
            exit 1
          fi
          echo "PASS"
