name: Test custom global-json-file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create global.json in a subdirectory with latest EOL 6.0 SDK version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myapp"
          # Use 6.0.428 which is the final SDK release for the EOL .NET 6.0 channel.
          # Since 6.0 is EOL, no newer version will be released, so no PR will be created.
          cat > "$GITHUB_WORKSPACE/myapp/global.json" <<'EOF'
          {
            "sdk": {
              "version": "6.0.428"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          global-json-file: ./myapp/global.json
          channel: '6.0'
          generate-step-summary: 'false'

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: sdk-version output should not be empty"
            exit 1
          fi
          echo "PASS: sdk-version is '$SDK_VERSION'"

      - name: Assert sdk-updated output is set
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          if [ -z "$SDK_UPDATED" ]; then
            echo "FAIL: sdk-updated output should not be empty"
            exit 1
          fi
          echo "PASS: sdk-updated is '$SDK_UPDATED'"
