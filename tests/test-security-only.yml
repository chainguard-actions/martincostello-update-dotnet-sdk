name: Test security-only mode (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test global.json in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/test-global-security.json" << 'EOF'
          {
            "sdk": {
              "version": "8.0.421",
              "rollForward": "latestFeature"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          global-json-file: ./test-global-security.json
          channel: '8.0'
          security-only: 'true'
          dry-run: 'true'
          generate-step-summary: 'false'

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: sdk-version output was empty"
            exit 1
          fi
          echo "PASS: sdk-version is '$SDK_VERSION'"

      - name: Assert sdk-updated output is a boolean string
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          if [ "$SDK_UPDATED" != "true" ] && [ "$SDK_UPDATED" != "false" ]; then
            echo "FAIL: sdk-updated should be 'true' or 'false', got '$SDK_UPDATED'"
            exit 1
          fi
          echo "PASS: sdk-updated is '$SDK_UPDATED'"

      - name: Assert security output is valid
        env:
          SECURITY: ${{ steps.action.outputs.security }}
        run: |
          echo "security: '$SECURITY'"
          # security output is 'true', 'false', or empty (when no update was applied)
          if [ "$SECURITY" = "true" ] || [ "$SECURITY" = "false" ] || [ -z "$SECURITY" ]; then
            echo "PASS: security output is '$SECURITY'"
          else
            echo "FAIL: security output should be 'true', 'false', or empty, got '$SECURITY'"
            exit 1
          fi
