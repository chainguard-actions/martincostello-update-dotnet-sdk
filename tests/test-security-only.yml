name: Test security-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch latest SDK version for channel 8.0
        id: fetch-latest
        run: |
          # Fetch from the same URL the action uses
          RELEASES=$(curl -sfL "https://raw.githubusercontent.com/dotnet/core/main/release-notes/8.0/releases.json")
          LATEST=$(echo "$RELEASES" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['latest-sdk'])")
          echo "latest=$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Create global.json with latest SDK version
        env:
          LATEST: ${{ steps.fetch-latest.outputs.latest }}
        run: |
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' "$LATEST" > "$GITHUB_WORKSPACE/global.json"
          echo "Created global.json with version: $LATEST"
          cat "$GITHUB_WORKSPACE/global.json"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          global-json-file: ./global.json
          channel: '8.0'
          security-only: 'true'
          generate-step-summary: 'false'

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: sdk-version output is empty"
            exit 1
          fi
          echo "PASS: sdk-version is '$SDK_VERSION'"

      - name: Assert sdk-updated is false (already on latest, no security update needed)
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
          SECURITY: ${{ steps.action.outputs.security }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          echo "security: $SECURITY"
          if [ "$SDK_UPDATED" != "false" ]; then
            echo "FAIL: expected sdk-updated=false but got '$SDK_UPDATED'"
            exit 1
          fi
          echo "PASS: sdk-updated is false as expected (security-only mode, already on latest)"
