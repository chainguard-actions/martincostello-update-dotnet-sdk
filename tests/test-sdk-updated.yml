name: Test SDK update detected (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test global.json in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/test-global-sdk-updated.json" << 'EOF'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          global-json-file: ./test-global-sdk-updated.json
          channel: '8.0'
          dry-run: 'true'
          generate-step-summary: 'false'
          branch-name: 'test-update-dotnet-sdk-act-harness'

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: sdk-version output was empty"
            exit 1
          fi
          echo "PASS: sdk-version is '$SDK_VERSION'"

      - name: Assert sdk-updated is true (old version should trigger update)
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          if [ "$SDK_UPDATED" != "true" ]; then
            echo "FAIL: expected sdk-updated to be 'true' for an old SDK version, got '$SDK_UPDATED'"
            exit 1
          fi
          echo "PASS: sdk-updated is true as expected"

      - name: Assert aspnetcore-version output is set when sdk-updated is true
        env:
          ASPNETCORE_VERSION: ${{ steps.action.outputs.aspnetcore-version }}
        run: |
          echo "aspnetcore-version: $ASPNETCORE_VERSION"
          if [ -z "$ASPNETCORE_VERSION" ]; then
            echo "FAIL: aspnetcore-version output was empty when sdk-updated is true"
            exit 1
          fi
          echo "PASS: aspnetcore-version is '$ASPNETCORE_VERSION'"

      - name: Assert runtime-version output is set when sdk-updated is true
        env:
          RUNTIME_VERSION: ${{ steps.action.outputs.runtime-version }}
        run: |
          echo "runtime-version: $RUNTIME_VERSION"
          if [ -z "$RUNTIME_VERSION" ]; then
            echo "FAIL: runtime-version output was empty when sdk-updated is true"
            exit 1
          fi
          echo "PASS: runtime-version is '$RUNTIME_VERSION'"

      - name: Assert branch-name output is empty in dry-run mode (PR not created)
        env:
          BRANCH_NAME: ${{ steps.action.outputs.branch-name }}
        run: |
          echo "branch-name: '$BRANCH_NAME'"
          # In dry-run mode, the PR creation is skipped and branch-name is empty
          echo "PASS: branch-name is '$BRANCH_NAME' (empty is expected in dry-run)"
