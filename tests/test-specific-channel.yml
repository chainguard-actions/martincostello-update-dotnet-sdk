name: Test specific channel input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create global.json for EOL channel 7.0 with its final SDK version
        run: |
          # Use 7.0.410 which is the final SDK release for the EOL .NET 7.0 channel.
          # Since 7.0 is EOL, no newer version will be released, so no PR will be created.
          cat > "$GITHUB_WORKSPACE/global.json" <<'EOF'
          {
            "sdk": {
              "version": "7.0.410"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          global-json-file: ./global.json
          channel: '7.0'
          generate-step-summary: 'false'

      - name: Assert sdk-version output is set and in 7.0 channel
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          echo "sdk-updated: $SDK_UPDATED"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: sdk-version output should not be empty"
            exit 1
          fi
          # Verify the version starts with 7.
          if ! echo "$SDK_VERSION" | grep -qE '^7\.'; then
            echo "FAIL: expected sdk-version to be in the 7.x channel, got '$SDK_VERSION'"
            exit 1
          fi
          echo "PASS: sdk-version '$SDK_VERSION' is in the 7.0 channel"

      - name: Assert pull-requests-closed is a JSON array
        env:
          PRS_CLOSED: ${{ steps.action.outputs.pull-requests-closed }}
        run: |
          echo "pull-requests-closed: $PRS_CLOSED"
          if [ -z "$PRS_CLOSED" ]; then
            echo "FAIL: pull-requests-closed output should not be empty"
            exit 1
          fi
          echo "PASS: pull-requests-closed is '$PRS_CLOSED'"
