name: Test custom global-json-file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create global.json at custom path with the latest SDK version for channel 8.0
        run: |
          LATEST=$(curl -sfL "https://raw.githubusercontent.com/dotnet/core/main/release-notes/8.0/releases.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['latest-sdk'])")
          echo "Latest SDK version for 8.0: $LATEST"
          if [ -z "$LATEST" ]; then
            echo "FAIL: could not determine latest SDK version"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/src"
          cat > "$GITHUB_WORKSPACE/src/global.json" <<EOF
          {
            "sdk": {
              "version": "$LATEST",
              "rollForward": "latestFeature"
            }
          }
          EOF
          echo "Created src/global.json with version $LATEST"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          global-json-file: ./src/global.json
          channel: '8.0'
          generate-step-summary: 'false'

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: sdk-version output is empty"
            exit 1
          fi
          if ! echo "$SDK_VERSION" | grep -qE '^8\.'; then
            echo "FAIL: expected sdk-version to start with '8.' but got '$SDK_VERSION'"
            exit 1
          fi
          echo "PASS: sdk-version=$SDK_VERSION"

      - name: Assert sdk-updated output is set
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          if [ -z "$SDK_UPDATED" ]; then
            echo "FAIL: sdk-updated output is empty"
            exit 1
          fi
          echo "PASS: sdk-updated=$SDK_UPDATED"

      - name: Assert sdk-updated is false (version is already up-to-date)
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          if [ "$SDK_UPDATED" != "false" ]; then
            echo "FAIL: expected sdk-updated to be 'false' but got '$SDK_UPDATED'"
            exit 1
          fi
          echo "PASS: sdk-updated=false as expected"
