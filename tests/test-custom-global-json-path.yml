name: Test custom global.json path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up isolated git repo with global.json at custom path
        run: |
          mkdir -p /tmp/test-repo-custom/src
          cd /tmp/test-repo-custom
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > src/global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.100"
            }
          }
          EOF
          git add src/global.json
          git commit -m "Initial commit"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          global-json-file: /tmp/test-repo-custom/src/global.json
          dry-run: 'true'
          generate-step-summary: 'false'
          repo: ''

      - name: Assert sdk-version output is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: expected sdk-version output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert runtime-version output is set
        env:
          RUNTIME_VERSION: ${{ steps.action.outputs.runtime-version }}
        run: |
          echo "runtime-version: $RUNTIME_VERSION"
          if [ -z "$RUNTIME_VERSION" ]; then
            echo "FAIL: expected runtime-version output to be non-empty"
            exit 1
          fi
          echo "PASS"
