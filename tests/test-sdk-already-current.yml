name: Test SDK already up to date
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch latest .NET 8 SDK version and write global.json
        run: |
          # Fetch the latest release version from the same URL the action uses
          if command -v jq &>/dev/null; then
            LATEST=$(curl -sfL "https://raw.githubusercontent.com/dotnet/core/main/release-notes/8.0/releases.json" | jq -r '."latest-sdk"')
          elif command -v python3 &>/dev/null; then
            LATEST=$(curl -sfL "https://raw.githubusercontent.com/dotnet/core/main/release-notes/8.0/releases.json" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['latest-sdk'])")
          fi
          if [ -z "$LATEST" ]; then
            echo "FAIL: could not fetch latest SDK version"
            exit 1
          fi
          echo "Latest SDK version: $LATEST"
          cat > ./global.json << EOF
          {
            "sdk": {
              "version": "$LATEST",
              "rollForward": "latestFeature"
            }
          }
          EOF
          cat ./global.json

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          dry-run: 'true'
          channel: '8.0'
          generate-step-summary: 'false'

      - name: Assert sdk-updated is false
        env:
          SDK_UPDATED: ${{ steps.action.outputs.sdk-updated }}
        run: |
          echo "sdk-updated: $SDK_UPDATED"
          if [ "$SDK_UPDATED" != "false" ]; then
            echo "FAIL: expected sdk-updated=false but got '$SDK_UPDATED'"
            exit 1
          fi
          echo "PASS: sdk-updated=false as expected"

      - name: Assert sdk-version is set
        env:
          SDK_VERSION: ${{ steps.action.outputs.sdk-version }}
        run: |
          echo "sdk-version: $SDK_VERSION"
          if [ -z "$SDK_VERSION" ]; then
            echo "FAIL: expected sdk-version to be non-empty"
            exit 1
          fi
          echo "PASS: sdk-version=$SDK_VERSION"
