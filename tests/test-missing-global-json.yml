name: Test missing global.json fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure global.json does not exist
        run: |
          rm -f "$GITHUB_WORKSPACE/nonexistent-global.json"

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          global-json-file: ./nonexistent-global.json
          generate-step-summary: 'false'
        continue-on-error: true

      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when global.json is missing, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when global.json was missing"
